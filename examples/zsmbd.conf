# Example zsmbd configuration: zsmbd serve --config zsmbd.conf
#
# Settings are `key = value` lines before the first share section (or in an
# optional [global] section). Every setting is optional. Comments must be on
# lines of their own, starting with `#` or `;`. zsmbd rereads this file when
# it changes and keeps comments and layout when it edits it.

# Default: the host name up to its first dot, at most 15 characters, upper-cased.
# server_name = HAL9000

# Default: WORKGROUP.
workgroup = HOME

# Booleans are yes or no (or true or false). Defaults: signing_required = yes, encrypt = no.
# signing_required = yes
encrypt = yes

# One [name] section per share. `path` is required: an absolute path to an
# existing directory. `comment` is optional; `read_only` and `guest_ok` are
# yes or no and default to no.

[data]
path = /srv/zsmbd/data
comment = Team files

[art]
path = /srv/zsmbd/art
comment = Pictures
read_only = yes
guest_ok = yes
