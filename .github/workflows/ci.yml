# Builds and tests zsmbd on its supported hosts: Fedora and Alpine Linux
# (x86_64 and aarch64) and macOS, plus Linux type checks and a short
# coverage-guided fuzz run. The Linux jobs also run the interoperability
# tests (test/interop), which mount CIFS: each runs in a privileged
# container on a host that has loaded the cifs module. See SECURITY.md.
# A vX.Y.Z tag also builds release archives on each platform's own runner
# and publishes them as a GitHub Release.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, for a longer fuzz run

env:
  ZIG_VERSION: 0.17.0

jobs:
  fedora:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Load the CIFS kernel module on the host
        run: sudo modprobe cifs || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe cifs; }
      # A privileged container shares the host's kernel, so the interop tests
      # can mount CIFS; a job-level container can't load the module first.
      - name: Build, test, and run the interoperability tests on Fedora
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e ZIG_VERSION fedora:latest sh -euc '
            dnf install -y --setopt=install_weak_deps=False sqlite-devel curl tar xz git samba-client cifs-utils rsync diffutils python3 util-linux kmod
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-$(uname -m)-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C /opt
            export PATH="/opt/zig-$(uname -m)-linux-$ZIG_VERSION:$PATH"
            zig build test --summary all
            zig build
            zig build lib
            zig build torture
            zig-out/bin/zsmbt --server zig-out/bin/zsmbd
            INTEROP_REQUIRE_KERNEL=1 sh test/interop/run.sh'

  alpine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Load the CIFS kernel module on the host
        run: sudo modprobe cifs || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe cifs; }
      # JavaScript actions can't run in Alpine containers, so run it directly.
      - name: Build, test, and run the interoperability tests on Alpine
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e ZIG_VERSION alpine:latest sh -euc '
            apk add --no-cache sqlite-dev curl tar xz git samba-client cifs-utils rsync diffutils python3 util-linux coreutils kmod
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-$(uname -m)-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C /opt
            export PATH="/opt/zig-$(uname -m)-linux-$ZIG_VERSION:$PATH"
            zig build test --summary all
            zig build
            zig build lib
            zig build torture
            zig-out/bin/zsmbt --server zig-out/bin/zsmbd
            INTEROP_REQUIRE_KERNEL=1 sh test/interop/run.sh'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
      - run: zig build
      - run: zig build lib
      - run: zig build torture
      - run: zig-out/bin/zsmbt --server zig-out/bin/zsmbd
      - name: Linux type checks
        run: |
          zig build check -Dtarget=x86_64-linux-gnu
          zig build check -Dtarget=aarch64-linux-gnu
          zig build check -Dtarget=x86_64-macos

  fuzz:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False sqlite-devel tar xz git
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The fuzzer needs .zig-cache/tmp, which the plain test run creates.
      - run: zig build test
      - name: Coverage-guided fuzzing
        # Zig 0.17 ends its fuzz report with a bogus "corrupted coverage
        # file" error, so judge the run by its crash markers instead.
        run: |
          zig build test --fuzz=${{ github.event_name == 'schedule' && '20M' || '100K' }} > fuzz.log 2>&1 || true
          tail -n 30 fuzz.log
          grep -q "FUZZING REPORT" fuzz.log
          if grep -E "exited with code|panic|leaked|input saved" fuzz.log; then exit 1; fi
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: .zig-cache/f/
          if-no-files-found: ignore

  # Release archives for a vX.Y.Z tag, two per platform (zsmbd, and
  # zsmbd-dev with libsmbd), each pair built and smoke-tested on a runner of
  # its own platform once every check above has passed (.github/dist.sh),
  # then published as a GitHub Release with that version's CHANGELOG.md
  # section.
  dist-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fedora, alpine, macos, fuzz]
    # Each archive names a CPU with hardware AES, which SMB signing and
    # encryption need to be fast (std.crypto picks its AES at compile time,
    # and on x86_64 it uses AES-NI only with AVX): x86_64 from Sandy Bridge
    # and Bulldozer on, and aarch64 with the Crypto Extension.
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, libc: gnu, image: "fedora:latest", cpu: "x86_64_v2+aes+avx+pclmul" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, libc: gnu, image: "fedora:latest", cpu: "generic+aes+sha2" }
          - { runner: ubuntu-latest, arch: x86_64, libc: musl, image: "alpine:latest", cpu: "x86_64_v2+aes+avx+pclmul" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, libc: musl, image: "alpine:latest", cpu: "generic+aes+sha2" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the archive
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e ZIG_VERSION -e LIBC=${{ matrix.libc }} -e CPU=${{ matrix.cpu }} ${{ matrix.image }} sh -euc '
            if [ "$LIBC" = gnu ]; then
              dnf install -y -q --setopt=install_weak_deps=False sqlite-devel curl tar xz gzip gcc
              # Runs on glibc 2.34 or later (RHEL 9, Ubuntu 22.04, Debian 12).
              # Given a target, zig finds libsqlite3 only where it is told.
              mkdir -p /tmp/sqlite/lib && ln -s /usr/lib64/libsqlite3.so /tmp/sqlite/lib/
              set -- -Dtarget="$(uname -m)-linux-gnu.2.34" -Dsqlite-prefix=/tmp/sqlite
            else
              # The native OS and ABI, so zig finds libsqlite3 itself.
              apk add --no-cache sqlite-dev curl tar xz gcc musl-dev
              set --
            fi
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-$(uname -m)-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C /opt
            export PATH="/opt/zig-$(uname -m)-linux-$ZIG_VERSION:$PATH"
            sh .github/dist.sh "$(uname -m)-linux-$LIBC" "$@" -Dcpu="$CPU"'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}-linux-${{ matrix.libc }}
          path: dist/*.tar.gz
          if-no-files-found: error

  dist-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fedora, alpine, macos, fuzz]
    strategy:
      matrix:
        include:
          # aarch64-macos defaults to apple_m1; x86_64-macos to core2,
          # without AES-NI. Every Intel Mac macOS 13 runs on has AVX2.
          - { runner: macos-latest, arch: aarch64, cpu: apple_m1 }
          - { runner: macos-15-intel, arch: x86_64, cpu: "x86_64_v3+aes+pclmul" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Runs on macOS 13 or later, with the system libsqlite3.
      - name: Build the archive
        run: |
          sh .github/dist.sh ${{ matrix.arch }}-macos -Dtarget=${{ matrix.arch }}-macos.13.0 -Dcpu=${{ matrix.cpu }} -Dsqlite-prefix="$(xcrun --show-sdk-path)/usr"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [dist-linux, dist-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -q "^ *\.version = \"$v\"," build.zig.zon || { echo "tag $GITHUB_REF_NAME is not the version in build.zig.zon"; exit 1; }
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no $v section"; exit 1; }
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "zsmbd $v" --notes-file notes.md
